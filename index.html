<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>다 세워버려</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#ffd59e;font-family:Jua,sans-serif;color:#2b2b2b;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none}
.btn{background:#ff3b5c;color:#fff;font-family:'Black Han Sans';font-size:22px;padding:14px 34px;border-radius:16px;border:3px solid #2b2b2b;box-shadow:0 5px 0 #2b2b2b;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #2b2b2b}
.btn.sub{background:#fff;color:#2b2b2b;font-size:17px;padding:10px 22px}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:20px;text-align:center}
/* title */
#title .logo{font-family:'Black Han Sans';font-size:min(19vw,110px);line-height:.95;color:#ff3b5c;-webkit-text-stroke:3px #2b2b2b;text-shadow:0 7px 0 #2b2b2b;transform:rotate(-4deg);animation:wob 2.4s ease-in-out infinite}
#title .logo span{display:block;color:#ffd23f}
@keyframes wob{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(3deg) scale(1.04)}}
#title .tag{margin:26px 0 30px;font-size:18px;background:#fff;padding:8px 16px;border-radius:30px;border:2px solid #2b2b2b}
#title .foot{position:absolute;bottom:18px;font-size:13px;opacity:.7}
/* select */
#select{justify-content:flex-start;overflow-y:auto;touch-action:pan-y;background:rgba(255,233,199,.86);padding-top:max(20px,env(safe-area-inset-top))}
#select h2{font-family:'Black Han Sans';font-size:30px;margin:8px 0 2px}
#selStats{font-size:14px;opacity:.75;margin-bottom:12px}
#selList{width:100%;max-width:560px}
.chsec{margin:10px 0 16px;text-align:left}
.chh{font-family:'Black Han Sans';font-size:17px;margin:0 4px 8px;color:#6b3e1e}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.lv{background:#fff;border:3px solid #2b2b2b;border-radius:14px;padding:8px 4px;box-shadow:0 4px 0 #2b2b2b;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:82px}
.lv i{font-style:normal;font-family:'Black Han Sans';font-size:13px;color:#ff3b5c}
.lv b{font-weight:normal;font-size:15px;word-break:keep-all}
.lv s{text-decoration:none;color:#ffb703;font-size:14px;letter-spacing:1px}
.lv.locked{background:#e5d5c0;color:#9a8a77;box-shadow:0 4px 0 #9a8a77;border-color:#9a8a77}
.selbar{display:flex;gap:10px;margin:10px 0 30px}
/* hud */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;padding:max(10px,env(safe-area-inset-top)) 10px 0}
#hud .row{display:flex;align-items:center;gap:8px}
#hud .ib{pointer-events:auto;width:42px;height:42px;border-radius:12px;background:#fff;border:3px solid #2b2b2b;font-size:19px;box-shadow:0 3px 0 #2b2b2b;flex:none}
#hudMid{flex:1;min-width:0;text-align:center}
#hudTitle{font-family:'Black Han Sans';font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-text-stroke:5px #fff;paint-order:stroke fill}
#hudThrows{font-size:13px;-webkit-text-stroke:3px #fff;paint-order:stroke fill}
#hudChips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:6px}
#hudChips span{background:rgba(255,255,255,.88);border:2px solid #2b2b2b;border-radius:20px;padding:2px 9px;font-size:13px}
#rotlive{white-space:nowrap;position:fixed;transform:translate(-50%,-50%);font-family:'Black Han Sans';font-size:22px;color:#fff;-webkit-text-stroke:5px #2b2b2b;paint-order:stroke fill;pointer-events:none;opacity:0;z-index:4;transition:opacity .2s}
#toast{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:8;background:#2b2b2b;color:#fff;font-size:22px;padding:12px 22px;border-radius:16px;pointer-events:none;transition:all .18s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-2deg)}
#toast.warn{background:#ff9f1c;color:#2b2b2b}
/* cards */
.card{background:#fff;border:4px solid #2b2b2b;border-radius:24px;box-shadow:0 8px 0 #2b2b2b;padding:22px 22px 24px;width:min(92vw,380px);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.5) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
#intro,#win,#chap{background:rgba(43,43,43,.35);z-index:12}
#introCh{font-size:13px;color:#ff3b5c}
#introNum{font-family:'Black Han Sans';font-size:14px;opacity:.5;margin-top:2px}
#introPrev{width:200px;height:160px;margin:6px auto 0;display:block;animation:spin 3s ease-in-out infinite}
@keyframes spin{0%,60%{transform:rotate(0)}80%{transform:rotate(360deg)}100%{transform:rotate(360deg)}}
#introName{font-size:20px;margin-top:4px}
#introName b{font-family:'Black Han Sans';font-weight:normal;font-size:38px;color:#ff3b5c;display:block;line-height:1.1}
#introSize{display:inline-block;margin:8px 0;font-size:13px;background:#ffe9c7;border-radius:20px;padding:3px 12px}
#introJoke{font-size:17px;line-height:1.45;word-break:keep-all;margin-bottom:6px}
#introTip{font-size:14px;color:#2a7d6f;background:#e6fbf6;border-radius:12px;padding:8px 10px;margin:8px 0 2px;word-break:keep-all}
.how{font-size:12.5px;opacity:.6;margin:10px 0 14px;word-break:keep-all}
#winTitle{font-family:'Black Han Sans';font-size:54px;color:#ff3b5c;-webkit-text-stroke:2px #2b2b2b;transform:rotate(-5deg);animation:stamp .4s cubic-bezier(.2,2,.4,1)}
@keyframes stamp{from{transform:scale(3) rotate(-15deg);opacity:0}to{transform:rotate(-5deg);opacity:1}}
#winStars{font-size:44px;margin:6px 0;letter-spacing:4px;color:#ddd;-webkit-text-stroke:1.5px #2b2b2b}
#winStars .on{color:#ffd23f}
#winSub{font-size:17px;margin-bottom:4px;word-break:keep-all}
#winInfo{font-size:14px;opacity:.6;margin-bottom:16px}
.btns{display:flex;gap:10px;justify-content:center;align-items:center}
#chap .card{background:#2b2b2b;color:#fff}
#chapNum{font-family:'Black Han Sans';color:#ffd23f;font-size:18px;letter-spacing:2px}
#chapName{font-family:'Black Han Sans';font-size:46px;margin:6px 0}
#chapSub{font-size:16px;opacity:.85;word-break:keep-all}
#chapScale{font-size:30px;margin:16px 0 20px}
/* ending */
#ending{z-index:12;justify-content:flex-start;padding-top:12vh;pointer-events:none}
#endLines p{font-family:'Black Han Sans';font-size:min(7vw,32px);color:#fff;-webkit-text-stroke:6px #2b2b2b;paint-order:stroke fill;opacity:0;animation:fin .8s forwards;margin:6px 0}
@keyframes fin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#endBox{opacity:0;animation:fin .8s forwards;pointer-events:auto;margin-top:auto;margin-bottom:6vh}
#endBig{opacity:0;animation:fin .8s forwards;margin-top:10px;font-family:'Black Han Sans';font-size:min(16vw,80px);color:#ff3b5c;-webkit-text-stroke:3px #2b2b2b;text-shadow:0 6px 0 #2b2b2b;margin-bottom:12px;line-height:1}
#endStats{background:#fff;border:3px solid #2b2b2b;border-radius:16px;padding:12px 18px;font-size:16px;line-height:1.7;margin-bottom:16px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title" class="overlay">
  <div class="logo">다<br><span>세워</span>버려</div>
  <div class="tag">던져서 세운다. 그게 다다.</div>
  <button class="btn" id="startBtn">시작하기</button>
  <div class="foot">물병부터 지구까지 · 25 스테이지 · 🔊 소리 켜고 하면 2배 웃김</div>
</div>

<div id="select" class="overlay hidden">
  <h2>스테이지 선택</h2>
  <div id="selStats"></div>
  <div id="selList"></div>
  <div class="selbar"><button class="btn sub" id="selBack">← 타이틀</button><button class="btn sub" id="resetSave">진행 초기화</button></div>
</div>

<div id="hud" class="hidden">
  <div class="row">
    <button class="ib" id="menuBtn">☰</button>
    <div id="hudMid"><div id="hudTitle"></div><div id="hudThrows"></div></div>

    <button class="ib" id="muteBtn">🔊</button>
  </div>

</div>
<div id="rotlive"></div>
<div id="toast"></div>

<div id="intro" class="overlay hidden"><div class="card">
  <div id="introCh"></div><div id="introNum"></div>

  <div id="introName"></div>
  <div id="introSize"></div>
  <div id="introJoke"></div>
  <div id="introTip"></div>
  <div class="how">화면 아무 데나 누르고 <b>반대 방향으로 당겼다 놓기</b>.<br>위로 높이 던질수록 더 많이 돕니다. 똑바로 서면 성공!</div>
  <button class="btn" id="introGo">던지러 가기</button>
</div></div>

</div></div>

  <div id="chapNum"></div><div id="chapName"></div><div id="chapSub"></div><div id="chapScale"></div>

</div></div>

  <div id="endLines"></div>
  <div id="endBig" class="big">다 세웠다.</div>
  <div id="endBox">
    <div id="endStats"></div>
    <button class="btn" id="endAgain">스테이지 선택</button>
  </div>
</div>

<script>
// ===== 다 세워버려 : physics core + level data =====
const G = 22, VMAX = 14, DT = 1 / 240;

function convexHull(pts) {
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  up.pop(); lo.pop();
  return lo.concat(up); // CCW
}

function circlePts(cx, cy, r, n, a0 = 0, a1 = Math.PI * 2) {
  const o = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; o.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return o;
}

function makeShape(def) {
  const w = def.w, h = def.h || 1;
  const pts = convexHull(def.hull.map(([x, y]) => [x * w, y * h]));
  let A = 0, cx = 0, cy = 0, I0 = 0;
  for (let i = 0; i < pts.length; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % pts.length];
    const c = x1 * y2 - x2 * y1;
    A += c; cx += (x1 + x2) * c; cy += (y1 + y2) * c;
    I0 += c * (x1 * x1 + x1 * x2 + x2 * x2 + y1 * y1 + y1 * y2 + y2 * y2);
  }
  A /= 2; cx /= 6 * A; cy /= 6 * A; I0 /= 12;
  const Ic = I0 / A - (cx * cx + cy * cy);
  const com = [cx, cy + (def.com || 0) * h];
  const d2 = (com[1] - cy) ** 2;
  const I = (Ic + d2) * (def.inertia || 1);
  return { w, h, pts, com, I, local: pts.map(([x, y]) => [x - com[0], y - com[1]]) };
}

function platAt(pl, t) {
  if (!pl.move) return { x1: pl.x1, x2: pl.x2, y: pl.y, vx: 0 };
  const m = pl.move, ph = 2 * Math.PI * t / m.period;
  const off = m.amp * Math.sin(ph), vx = m.amp * 2 * Math.PI / m.period * Math.cos(ph);
  return { x1: pl.x1 + off, x2: pl.x2 + off, y: pl.y, vx };
}

function newBody(L, S) {
  return { x: L.launch[0] + S.com[0], y: L.launch[1] + S.com[1], a: 0, vx: 0, vy: 0, w: 0,
    t: 0, touched: false, rot: 0, rest: 0, contacts: 0, onTarget: true, lastPlat: null, maxImpact: 0, state: 'held' };
}

function launch(b, L, angleDeg, power) {
  const sp = Math.max(0.05, Math.min(1, power)) * VMAX;
  const a = angleDeg * Math.PI / 180;
  b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
  const dir = b.vx >= -0.001 ? 1 : -1;
  b.w = -dir * (6 + 0.3 * sp) * (L.obj.spin || 1);
  b.state = 'fly'; b.t = 0;
}

function c0vx(cs){return cs[0].pvx;}
function step(b, S, L, T, dt) {
  const o = L.obj;
  const g = G * (L.grav || 1);
  b.vy -= g * dt;
  if (L.wind) if (!b.contacts) b.vx += L.wind * dt;
  // cat righting reflex
  if (o.righting && !b.touched && b.vy < 0) {
    const k = Math.round(b.a / (2 * Math.PI)) * 2 * Math.PI;
    const err = b.a - k;
    b.w += (-70 * err - 9 * b.w) * dt;
  }
  // volcano eruption: extra torque during first part of flight
  if (o.erupt && !b.touched && b.t < 0.35) { b.w += -o.erupt * dt * Math.sign(b.vx || 1); }

  const ca = Math.cos(b.a), sa = Math.sin(b.a);
  const cs = [];
  let maxPen = 0;
  for (const [lx, ly] of S.local) {
    const rx = lx * ca - ly * sa, ry = lx * sa + ly * ca;
    const wx = b.x + rx, wy = b.y + ry;
    for (const pl of L.plats) {
      const P = platAt(pl, T);
      if (wx >= P.x1 && wx <= P.x2 && wy < P.y && P.y - wy < 0.3) {
        const pen = P.y - wy;
        cs.push({ rx, ry, pen, pvx: P.vx, pl });
        if (pen > maxPen) maxPen = pen;
      }
    }
  }
  b.contacts = cs.length;
  if (cs.length) {
    const e = o.e ?? 0.1, mu = o.mu ?? 0.8, I = S.I;
    let impact = 0;
    for (const c of cs) {
      const vn = b.vy + b.w * c.rx;
      c.bias = vn < -1.5 ? -e * vn : 0;
      c.kn = 1 + c.rx * c.rx / I; c.kt = 1 + c.ry * c.ry / I; c.jn = 0; c.jt = 0;
      if (-vn > impact) impact = -vn;
    }
    if (!b.touched) { b.touched = true; b.firstImpact = impact; }
    b.maxImpact = Math.max(b.maxImpact, impact);
    for (let it = 0; it < 12; it++) {
      for (const c of cs) {
        const vn = b.vy + b.w * c.rx;
        let dj = (-vn + c.bias) / c.kn;
        const nj = Math.max(0, c.jn + dj); dj = nj - c.jn; c.jn = nj;
        b.vy += dj; b.w += c.rx * dj / I;
        const vt = b.vx - b.w * c.ry - c.pvx;
        let dt2 = -vt / c.kt;
        const lim = mu * c.jn;
        const nt = Math.max(-lim, Math.min(lim, c.jt + dt2)); dt2 = nt - c.jt; c.jt = nt;
        b.vx += dt2; b.w += -c.ry * dt2 / I;
      }
    }
    b.y += Math.max(0, maxPen - 0.003) * 0.5;
    const sl = o.slosh ?? 6;
    b.w *= Math.exp(-sl * dt);
    // landing assist ("water slosh magic"): near-upright landings get pulled upright
    const tgt = o.flip ? Math.PI : 0;
    const d = ((b.a - tgt) % (2 * Math.PI) + 3 * Math.PI) % (2 * Math.PI) - Math.PI;
    const tol = (o.tol ?? 30) * Math.PI / 180;
    if (Math.abs(d) < tol) {
      b.w += (-(o.mag ?? 90) * d - 16 * b.w) * dt;
      b.vx += (c0vx(cs) - b.vx) * Math.min(1, 6 * dt);
    }
    b.onTarget = cs.every(c => c.pl.target !== false);
    b.lastPlat = cs[0].pl;
    b.platVx = cs[0].pvx;
  }
  b.x += b.vx * dt; b.y += b.vy * dt;
  b.a += b.w * dt; b.rot += b.w * dt;
  b.t += dt;
}

// returns null while running, else result string
function judge(b, L, dt) {
  if (b.y < (L.killY ?? -5) || Math.abs(b.x) > 40) return 'fall';
  const pv = b.platVx || 0;
  const slow = b.contacts > 0 && Math.hypot(b.vx - pv, b.vy) < 0.12 && Math.abs(b.w) < 0.2;
  if (slow) b.rest += dt; else b.rest = 0;
  if (b.rest > 0.55) {
    const tgt = L.obj.flip ? Math.PI : 0;
    let d = ((b.a - tgt) % (2 * Math.PI) + 3 * Math.PI) % (2 * Math.PI) - Math.PI;
    if (Math.abs(d) > 0.2) return 'lie';
    if (!b.onTarget) return 'wrongplace';
    const turns = Math.abs(b.rot) / (2 * Math.PI);
    if (turns < (L.obj.minRot ?? 1) - 0.35) return 'norot';
    return 'success';
  }
  if (b.t > 9) return 'timeout';
  return null;
}

function simulate(L, angle, power, S) {
  S = S || makeShape(L.obj);
  const b = newBody(L, S);
  launch(b, L, angle, power);
  let T = 0;
  for (let i = 0; i < 240 * 10; i++) {
    step(b, S, L, T, DT); T += DT;
    const r = judge(b, L, DT);
    if (r) return { r, turns: Math.abs(b.rot) / (2 * Math.PI) };
  }
  return { r: 'timeout' };
}

// ===== LEVELS =====
// plats: x1,x2,y, kind (visual), target(false = not counted)
const CHAPTERS = [
  { id: 0, name: '내 방 책상', sub: '모든 위대한 일은 책상 위에서 시작된다', theme: 'room' },
  { id: 1, name: '우리 동네', sub: '책상이 좁아졌다. 밖으로 나가자', theme: 'town' },
  { id: 2, name: '대도시', sub: '동네도 좁아졌다. 스케일 업!', theme: 'city' },
  { id: 3, name: '지구', sub: '이제 세울 게 자연밖에 없다', theme: 'earth' },
  { id: 4, name: '우주', sub: '마지막으로 세울 것이 하나 남았다', theme: 'space' },
];

const LEVELS = [
  // ---------- CH1 ROOM ----------
  { ch: 0, name: '물병', size: '25cm', joke: '모든 전설은 여기서 시작됐다.',
    tip: '화면을 당겼다 놓으면 던집니다. 세게 던질수록 많이 돌아요!',
    obj: { key: 'bottle', tol: 36, w: .38, hull: [[-.5, 0], [.5, 0], [.5, .62], [.22, .8], [.22, 1], [-.22, 1], [-.22, .8], [-.5, .62]], com: -.18, slosh: 22, e: .05, mu: 1, spin: 1, minRot: 1 },
    launch: [0, .9], plats: [{ x1: -1, x2: 6.5, y: 0, kind: 'desk' }], preview: 1 },
  { ch: 0, name: '휴대폰', size: '15cm', joke: '액정 깨지면 책임 안 집니다.',
    obj: { key: 'phone', w: .48, hull: [[-.5, 0], [.5, 0], [.5, 1], [-.5, 1]], slosh: 12, e: .08, mu: .9, spin: 1, minRot: 1 },
    launch: [0, .9], plats: [{ x1: -1, x2: 1, y: 0, kind: 'desk', target: false }, { x1: 2.2, x2: 4.8, y: .45, kind: 'books' }], killY: -2, preview: 1 },
  { ch: 0, name: '컵라면', size: '10cm', joke: '두 바퀴 돌려야 면이 골고루 익습니다.',

function tone(f, d, type = 'sine', vol = .15, f2 = null, delay = 0) {

  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();

  norot: ['안 돌리고 세우면 반칙!', '{r}바퀴 이상 돌려야 인정!', '그냥 내려놓기 금지 🙅'],
  timeout: ['{n} 결정을 못 하고 있습니다.', '너무 오래 고민 중...'],

const WIN = ['섰다!!', '기립 성공!', '완벽한 착지!', '세웠다!!', '이게 서네?!'];
const WINSUB = ['박수 쳐주세요 👏', '물리학자들이 당황하고 있습니다.', '{n} 오늘부터 서서 삽니다.', '뉴턴도 감탄했다.', '이 장면 쇼츠 각.', '{n} 본인도 놀람.'];

function onResult(r) {

    save.unlocked = Math.max(save.unlocked, Math.min(LEVELS.length, cur.idx + 2));
    save.time += (performance.now() - cur.startTime) / 1000;
    if (cur.idx === LEVELS.length - 1) save.done = true;

function toast(text, kind) {

  clearTimeout(t._h); t._h = setTimeout(() => t.className = '', 1500);
}

// ---------- particles ----------
function confetti() {
  const b = cur.b;
  const cols = ['#ff4d6d', '#ffd23f', '#3bceac', '#4d96ff', '#b388ff', '#ff8c42'];
  for (let i = 0; i < 90; i++) particles.push({ x: b.x, y: b.y + .5, vx: (Math.random() - .5) * 9, vy: Math.random() * 9 + 3, life: 2 + Math.random(), c: pick(cols), r: Math.random() * 6, kind: 'conf', sz: .05 + Math.random() * .06 });
}
function puff(x, y, n, col, spd = 2) {
  for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - .5) * spd, vy: Math.random() * spd * .6, life: .6 + Math.random() * .4, c: col, kind: 'puff', sz: .06 + Math.random() * .08 });
}

// ---------- main loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = Math.min(.05, (now - last) / 1000); last = now;
  if (mode === 'play' && cur) update(dt);
  render(dt);
  requestAnimationFrame(frame);
}

function update(dt) {
  acc += dt;
  const b = cur.b, L = cur.L;
  while (acc >= DT) {
    acc -= DT; cur.T += DT;
    if (cur.state === 'fly' || cur.state === 'won' || cur.state === 'failwait') {
      if (cur.state === 'fly' || b.contacts || b.state === 'fly') {
        const wasTouched = b.touched, pc = b.contacts;
        step(b, cur.S, L, cur.T, DT);
        if (b.contacts && !pc) {
          const imp = b.firstImpact || 3;
          if (!wasTouched || imp > 2) { SFX.thud(wasTouched ? 3 : imp); puff(b.x, b.y - .3, 5, 'rgba(255,255,255,.8)', 1.5); }
        }
        if (cur.state === 'fly') {
          const r = judge(b, L, DT);
          if (r) onResult(r);
        }
      }
    }
  }
  if (cur.state === 'fly') {
    const t = Math.abs(b.rot) / (2 * Math.PI);
    const el = $('rotlive'); el.style.opacity = 1; el.textContent = t.toFixed(1) + '바퀴';
    if (L.obj.key === 'volcano' && !b.touched && Math.random() < .6) particles.push({ x: b.x, y: b.y, vx: (Math.random() - .5) * 1.5, vy: 1 + Math.random(), life: 1, c: Math.random() < .5 ? '#ff6b35' : '#666', kind: 'puff', sz: .1 });
    if (L.obj.key === 'whale' && !b.touched && Math.random() < .2) particles.push({ x: b.x, y: b.y, vx: (Math.random() - .5), vy: 1, life: .6, c: '#bfe9ff', kind: 'puff', sz: .05 });
  }
  if (cur.state !== 'fly') $('rotlive').style.opacity = 0;
  if (cur.state === 'failwait') { failTimer -= dt; if (failTimer <= 0) resetBody(); }
  for (const p of particles) { p.vy -= (p.kind === 'conf' ? 9 : 1) * dt; p.vx *= .99; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; p.r += dt * 8; }
  particles = particles.filter(p => p.life > 0);
  if (shake > 0) shake -= dt;
}

// ---------- rendering ----------
function render(dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (mode === 'title' || mode === 'select') { drawTitleBg(); return; }
  if (mode === 'ending') { drawEnding(dt); return; }
  if (!cur) return;
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * 10 * shake, (Math.random() - .5) * 10 * shake);
  const theme = CHAPTERS[cur.L.ch].theme;
  drawBackground(theme, cur.L);
  // water
  if (cur.L.water !== undefined) drawWater(cur.L.water);
  // platforms
  for (const p of cur.L.plats) drawPlat(p, platAt(p, cur.T));
  // target flags
  for (const p of cur.L.plats) if (p.target !== false && cur.L.plats.length > 1 || (p.target !== false && p.move)) { const P = platAt(p, cur.T); drawFlag((P.x1 + P.x2) / 2, P.y, P.x2 - P.x1); }
  // hand at launch
  if (cur.state === 'aim' || cur.state === 'intro') drawHand(cur.L.launch[0], cur.L.launch[1]);
  // aim
  if (cur.state === 'aim') drawAim();
  // object
  drawObject(cur.b, cur.S, cur.L);
  // wind
  if (cur.L.wind) drawWind(cur.L.wind);
  // particles
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = p.c;
    if (p.kind === 'conf') { ctx.save(); ctx.translate(sx(p.x), sy(p.y)); ctx.rotate(p.r); const s = p.sz * cam.s; ctx.fillRect(-s / 2, -s / 4, s, s / 2); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), p.sz * cam.s * (1.5 - p.life * .5), 0, 7); ctx.fill(); }
  }

  const b = cur.b, top = sy(b.y);

  const el = $('rotlive'); el.style.left = clamp(sx(b.x), 40, W - 40) + 'px'; el.style.top = clamp(sy(b.y) - cam.s * 1.1, 70, H - 40) + 'px';
}

function drawAim() {

function drawHand(x, y) {

function drawFlag(x, y, w) {
  const X = sx(x), Y = sy(y), s = cam.s, t = performance.now() / 300;

  ctx.quadraticCurveTo(px + s * .2, Y - hgt + s * .2 + Math.sin(t + 1) * 3, px, Y - hgt + s * .25); ctx.fill();

function drawWind(wv) {
  const t = performance.now() / 1000;
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  for (let i = 0; i < 7; i++) {
    const y = 90 + ((i * 97) % (H * .55));
    let x = ((t * wv * 90 + i * 211) % (W + 200) + W + 200) % (W + 200) - 100;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x - Math.sign(wv) * 30, y - 6, x - Math.sign(wv) * 60, y); ctx.stroke();

function drawWater(level) {
  const Y = sy(level), t = performance.now() / 700;

// ---- backgrounds ----
function sky(c1, c2) { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c1); g.addColorStop(1, c2); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }

    sky('#ffe9c7', '#ffd59e');

    for (let x = 0; x < W; x += 40) for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.arc(x + (y / 40 % 2) * 20, y, 3, 0, 7); ctx.fill(); }

    ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(wx0 + ww / 2, wy0); ctx.lineTo(wx0 + ww / 2, wy0 + wh); ctx.moveTo(wx0, wy0 + wh / 2); ctx.lineTo(wx0 + ww, wy0 + wh / 2); ctx.stroke();

    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 90, 110); ctx.fillStyle = '#ff6b6b'; ctx.font = '22px "Black Han Sans"'; ctx.textAlign = 'center'; ctx.fillText('일단', 45, 40); ctx.fillText('세워', 45, 70);

// ---- platforms ----
function drawPlat(pl, P) {

      break;

const EYES = { bottle: [0, .5, .22, .09], phone: [0, .66, .24, .09], ramen: [0, .74, .2, .09], banana: [.05, .62, .18, .08], cat: [0, .78, .16, .085], chair: [0, .66, .4, .08], trash: [0, .62, .22, .09], vending: [0, .28, .22, .07], car: [0, .42, .24, .07], pole: [0, .55, .0, .06], dolmen: [0, .88, .24, .07], fish: [0, .75, .16, .08], bus: [0, .48, .24, .06], plane: [0, .72, .0, .06], building: [0, .5, .22, .06], whale: [0, .75, .18, .07], tower: [0, .6, .0, .05], ferris: [0, .55, .25, .07], tree: [0, .7, .2, .08], volcano: [0, .5, .18, .08], iceberg: [0, .6, .16, .08], pyramid: [0, .4, .16, .08], mountain: [0, .45, .18, .08], cloud: [0, .45, .18, .08], earth: [0, .55, .18, .08] };

function drawObject(b, S, L) {
  const key = L.obj.key, Wd = S.w, Hd = S.h;
  ctx.save();
  ctx.translate(sx(b.x), sy(b.y));
  ctx.rotate(-b.a);
  ctx.scale(cam.s, -cam.s);
  ctx.translate(-S.com[0], -S.com[1]);
  if (cur.state === 'aim' || cur.state === 'intro') ctx.translate(0, Math.sin(performance.now() / 300) * .02 + .01);
  ctx.lineWidth = .025; ctx.strokeStyle = OL; ctx.lineJoin = 'round';
  // shadow-ish outline glow
  DRAW[key](ctx, Wd, Hd);
  ctx.strokeStyle = OL; ctx.lineWidth = .02;
  // eyes
  const e = EYES[key];
  if (e) {
    const [ex, ey, sep, rr] = e; const r = Math.min(rr, .09);
    const exs = sep ? [ex * Wd - sep * Wd * .5, ex * Wd + sep * Wd * .5] : [ex * Wd];
    const y = ey * Hd;
    // pupil direction from velocity in local frame
    const ca = Math.cos(-b.a), sa = Math.sin(-b.a);
    let lvx = b.vx * ca - b.vy * sa, lvy = b.vx * sa + b.vy * ca; const lm = Math.hypot(lvx, lvy) || 1;
    const spd = Math.min(1, lm / 6);
    const mood = cur.state === 'won' ? 'happy' : cur.state === 'failwait' ? 'sad' : (cur.state === 'fly' && Math.abs(b.w) > 4 ? 'dizzy' : 'normal');
    for (const x of exs) {
      if (mood === 'happy') { ctx.lineWidth = .03; ctx.beginPath(); ctx.arc(x, y - r * .3, r * .8, .3, Math.PI - .3); ctx.stroke(); continue; }
      if (mood === 'sad') { ctx.lineWidth = .025; ctx.beginPath(); ctx.moveTo(x - r * .7, y - r * .7); ctx.lineTo(x + r * .7, y + r * .7); ctx.moveTo(x - r * .7, y + r * .7); ctx.lineTo(x + r * .7, y - r * .7); ctx.stroke(); continue; }
      CI(ctx, x, y, r, '#fff');
      const pr = mood === 'dizzy' ? r * .3 : r * .5;
      const t = performance.now() / 120;
      const px = mood === 'dizzy' ? Math.cos(t) * r * .4 : lvx / lm * r * .4 * spd, py = mood === 'dizzy' ? Math.sin(t) * r * .4 : lvy / lm * r * .4 * spd;
      CI(ctx, x + px, y + py, pr, '#111', true);
      CI(ctx, x + px + pr * .35, y + py + pr * .35, pr * .3, '#fff', true);
    }
    if (mood === 'happy' || mood === 'dizzy') { ctx.lineWidth = .02; ctx.beginPath(); const my = y - r * 1.6; if (mood === 'happy') ctx.arc(ex * Wd, my + r * .3, r * .6, Math.PI + .3, -.3); else ctx.ellipse(ex * Wd, my, r * .35, r * .45, 0, 0, 7); ctx.stroke(); }
  }
  ctx.restore();
}

// ---------- title bg ----------
let titleBody = null;
function drawTitleBg() {
  const t = performance.now() / 1000;
  sky('#ffe9c7', '#ffc56e');
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  for (let x = 0; x < W; x += 40) for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.arc(x + (y / 40 % 2) * 20, y, 3, 0, 7); ctx.fill(); }
  // floating spinning objects
  const keys = ['bottle', 'car', 'whale', 'chair', 'volcano', 'building', 'cat', 'earth', 'banana', 'dolmen', 'tree', 'vending'];
  keys.forEach((k, i) => {
    const L = LEVELS.find(l => l.obj.key === k); const S = makeShape(L.obj);
    const s = Math.min(W, H) * .11;
    const x = ((i * 0.618) % 1) * W, y = ((t * (18 + i * 4) + i * 150) % (H + 200)) - 100;
    ctx.save(); ctx.globalAlpha = .55; ctx.translate(x, H - y); ctx.rotate(t * (i % 2 ? 1 : -1) * (.6 + i * .07)); ctx.scale(s, -s); ctx.translate(0, -.5); ctx.lineWidth = .025; ctx.strokeStyle = OL;
    DRAW[k](ctx, S.w, S.h); ctx.restore();

}

// ---------- ending ----------
let endT = 0;
function drawEnding(dt) {
  endT += dt;
  const z = 1 + 9 * Math.pow(1 - clamp((endT - 1) / 5, 0, 1), 3); // zoom out
  ctx.fillStyle = '#0b0b2b'; ctx.fillRect(0, 0, W, H);
  // giant room
  ctx.save();
  const cx = W / 2, cy = H * .62;
  ctx.translate(cx, cy); ctx.scale(z, z); ctx.translate(-cx, -cy);
  sky('#ffe9c7', '#ffd59e');
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  for (let x = -W; x < 2 * W; x += 40) for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.arc(x + (y / 40 % 2) * 20, y, 3, 0, 7); ctx.fill(); }
  // window with space view
  const ww = Math.min(W * .34, 240), wx0 = W * .6, wy0 = H * .1, wh = ww * .8;
  ctx.fillStyle = '#0b0b2b'; ctx.fillRect(wx0, wy0, ww, wh);
  for (let i = 0; i < 30; i++) { ctx.fillStyle = '#fff'; ctx.fillRect(wx0 + (i * 37) % ww, wy0 + (i * 53) % wh, 2, 2); }
  ctx.strokeStyle = '#a0522d'; ctx.lineWidth = 8; ctx.strokeRect(wx0, wy0, ww, wh);
  // desk
  const dy = H * .62;
  ctx.fillStyle = '#8d5a3b'; ctx.fillRect(W * .12, dy, 18, H); ctx.fillRect(W * .88 - 18, dy, 18, H);
  ctx.fillStyle = '#b07548'; ctx.fillRect(W * .05, dy, W * .9, 22); ctx.strokeStyle = OL; ctx.lineWidth = 2.5; ctx.strokeRect(W * .05, dy, W * .9, 22);
  // bottle (normal size) & tiny earth
  const unit = Math.min(W, H) * .35;
  const drawK = (k, x, size, mood) => { const L = LEVELS.find(l => l.obj.key === k); const S = makeShape(L.obj); ctx.save(); ctx.translate(x, dy); ctx.scale(size, -size); ctx.lineWidth = .025; ctx.strokeStyle = OL; DRAW[k](ctx, S.w, S.h); const e = EYES[k]; const r = e[3], y = e[1] * S.h; ctx.lineWidth = .03; [-1, 1].forEach(sg => { ctx.beginPath(); ctx.arc(sg * e[2] * S.w * .5, y - r * .3, r * .8, .3, Math.PI - .3); ctx.stroke(); }); ctx.restore(); };
  drawK('bottle', W * .28, unit, 'happy');
  drawK('earth', W * .7, unit * .16, 'happy');
  ctx.restore();
  if (endT < 1.2) { ctx.fillStyle = `rgba(11,11,43,${1 - endT / 1.2})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- UI ----------
function showOnly(...ids) { ['title', 'select', 'hud', 'intro', 'win', 'ending', 'chap'].forEach(i => $(i).classList.toggle('hidden', !ids.includes(i))); }

function updateHud() {
  const L = cur.L;
  $('hudTitle').textContent = `${cur.idx + 1}. ${L.name} 세우기`;
  $('hudThrows').textContent = `던진 횟수 ${cur.throws}`;
  const chips = [];
  chips.push(`🔄 ${L.obj.minRot || 1}바퀴 이상`);
  if (L.plats.some(p => p.target === false) || L.plats.length === 1 && L.plats[0].move) chips.push('🚩 깃발 위에');
  if (L.wind) chips.push(`💨 바람 ${L.wind > 0 ? '→' : '←'}`);
  if (L.plats.some(p => p.move)) chips.push('🚚 움직임');
  if ((L.obj.mu ?? 1) < .4) chips.push('🧊 미끄러움');
  if (L.grav && L.grav < 1) chips.push('🪶 저중력');
  $('hudChips').innerHTML = chips.map(c => `<span>${c}</span>`).join('');
  $('muteBtn').textContent = save.mute ? '🔇' : '🔊';
}

function showIntro() {
  const L = cur.L, ch = CHAPTERS[L.ch];
  $('introCh').textContent = `CHAPTER ${L.ch + 1} · ${ch.name}`;
  $('introNum').textContent = `STAGE ${cur.idx + 1} / ${LEVELS.length}`;
  $('introName').innerHTML = `<b>${L.name}</b> 세우기`;
  $('introSize').textContent = `실제 크기 ${L.size}`;
  $('introJoke').textContent = L.joke;
  $('introTip').textContent = L.tip || '';
  $('introTip').style.display = L.tip ? 'block' : 'none';
  // preview canvas
  const pc = $('introPrev'), p2 = pc.getContext('2d'); const S = makeShape(L.obj);
  pc.width = 200 * DPR; pc.height = 160 * DPR; p2.setTransform(DPR, 0, 0, DPR, 0, 0); p2.clearRect(0, 0, 200, 160);
  const sc = 130 / Math.max(S.h, S.w * .9);
  p2.translate(100, 150); p2.scale(sc, -sc); p2.lineWidth = .025; p2.strokeStyle = OL; p2.lineJoin = 'round';
  DRAW[L.obj.key](p2, S.w, S.h);
  const e = EYES[L.obj.key]; if (e) { const [ex, ey, sep, r] = e; const xs = sep ? [-sep * S.w / 2, sep * S.w / 2] : [0]; xs.forEach(x => { CI(p2, x, ey * S.h, Math.min(r, .09), '#fff'); CI(p2, x, ey * S.h, Math.min(r, .09) * .5, '#111', true); }); }
  $('intro').classList.remove('hidden');
}
$('introGo').onclick = () => { SFX.click(); $('intro').classList.add('hidden'); cur.state = 'aim'; cur.startTime = performance.now(); };

function showWin(stars) {
  const L = cur.L;
  $('winTitle').textContent = pick(WIN);
  $('winSub').textContent = pick(WINSUB).replace('{n}', ig(L.name, '은', '는'));
  $('winStars').innerHTML = [1, 2, 3].map(i => `<span class="${i <= stars ? 'on' : ''}">★</span>`).join('');
  $('winInfo').textContent = `${cur.throws}번 만에 성공 · ${(Math.abs(cur.b.rot) / (2 * Math.PI)).toFixed(1)}바퀴`;
  const lastLv = cur.idx === LEVELS.length - 1;
  $('winNext').textContent = lastLv ? '엔딩 보기 ▶' : '다음 ▶';
  $('win').classList.remove('hidden');
}
$('winNext').onclick = () => {
  SFX.click(); $('win').classList.add('hidden');
  const n = cur.idx + 1;
  if (n >= LEVELS.length) { startEnding(); return; }
  if (LEVELS[n].ch !== cur.L.ch) showChapter(LEVELS[n].ch, () => startLevel(n));
  else startLevel(n);
};
$('winRetry').onclick = () => { SFX.click(); $('win').classList.add('hidden'); startLevel(cur.idx); };
$('retryBtn').onclick = () => { SFX.click(); if (cur && (cur.state === 'fly' || cur.state === 'failwait')) resetBody(); };
$('menuBtn').onclick = () => { SFX.click(); openSelect(); };
$('muteBtn').onclick = () => { save.mute = !save.mute; persist(); $('muteBtn').textContent = save.mute ? '🔇' : '🔊'; };

function showChapter(ch, cb) {
  const C = CHAPTERS[ch];
  $('chapNum').textContent = `CHAPTER ${ch + 1}`;
  $('chapName').textContent = C.name;
  $('chapSub').textContent = C.sub;
  $('chapScale').textContent = ['🧴 → 🪑', '🗑️ → 🚗 → 🪨', '🚌 → ✈️ → 🏢 → 🐋', '🌲 → 🌋 → 🏔️ → ☁️', '🌍'][ch];
  $('chap').classList.remove('hidden'); $('chap').classList.add('anim');
  SFX.whoosh(1);
  $('chapGo').onclick = () => { SFX.click(); $('chap').classList.add('hidden'); cb(); };
}

function openSelect() {
  mode = 'select'; cur = null;
  showOnly('select');
  const box = $('selList'); box.innerHTML = '';
  CHAPTERS.forEach(C => {
    const sec = document.createElement('div'); sec.className = 'chsec';
    sec.innerHTML = `<div class="chh">CH${C.id + 1} · ${C.name}</div>`;
    const grid = document.createElement('div'); grid.className = 'grid';
    LEVELS.forEach((L, i) => {
      if (L.ch !== C.id) return;
      const b = document.createElement('button');
      const locked = i + 1 > save.unlocked;
      b.className = 'lv' + (locked ? ' locked' : '');
      const st = save.stars[i] || 0;
      b.innerHTML = `<i>${i + 1}</i><b>${locked ? '🔒' : L.name}</b><s>${locked ? '' : '★'.repeat(st) + '☆'.repeat(3 - st)}</s>`;
      if (!locked) b.onclick = () => { SFX.click(); ac(); (i === 0 || LEVELS[i - 1].ch !== L.ch) && !save.stars[i] ? showChapter(L.ch, () => startLevel(i)) : startLevel(i); };
      grid.appendChild(b);
    });
    sec.appendChild(grid); box.appendChild(sec);
  });
  const total = save.stars.reduce((a, b) => a + (b || 0), 0);
  $('selStats').textContent = `★ ${total} / ${LEVELS.length * 3}  ·  총 ${save.throws}번 던짐`;
}

$('startBtn').onclick = () => {
  ac(); SFX.click();
  if (save.unlocked <= 1 && !save.stars[0]) showChapter(0, () => startLevel(0));
  else openSelect();
};
$('selBack').onclick = () => { SFX.click(); mode = 'title'; showOnly('title'); refreshTitle(); };
$('resetSave').onclick = () => {
  const b = $('resetSave');
  if (!b.dataset.confirm) { b.dataset.confirm = 1; b.textContent = '정말 초기화? 한 번 더 누르기'; setTimeout(() => { delete b.dataset.confirm; b.textContent = '진행 초기화'; }, 2500); return; }
  save = { unlocked: 1, stars: [], throws: 0, time: 0, mute: save.mute, done: false }; persist(); openSelect(); delete b.dataset.confirm; b.textContent = '진행 초기화';
};
function refreshTitle() { $('startBtn').textContent = save.unlocked > 1 || save.stars[0] ? '이어하기' : '시작하기'; }

function startEnding() {
  mode = 'ending'; endT = 0; showOnly('ending');
  const lines = $('endLines'); lines.innerHTML = '';
  const seq = ['지구가... 섰다.', '그런데 이 책상은...', '누구 거지?'];
  seq.forEach((s, i) => { const p = document.createElement('p'); p.textContent = s; p.style.animationDelay = (1 + i * 1.3) + 's'; lines.appendChild(p); });
  const total = save.stars.reduce((a, b) => a + (b || 0), 0);
  $('endStats').innerHTML = `총 던진 횟수 <b>${save.throws}</b>번<br>획득한 별 <b>★ ${total}</b> / ${LEVELS.length * 3}<br>플레이 시간 <b>${Math.round(save.time / 60)}</b>분`;
  $('endBox').style.animationDelay = $('endBig').style.animationDelay = (1 + seq.length * 1.3 + .5) + 's';
  SFX.success();
}
$('endAgain').onclick = () => { SFX.click(); openSelect(); };
